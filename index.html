<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca normativa · Licencias médicas</title>
<style>
:root{
  --ink:#0F172A;--text:#334155;--muted:#64748B;--faint:#94A3B8;--line:#CBD5E1;--line2:#E2E8F0;--bg:#F8FAFC;--white:#FFFFFF;
  --teal:#0D9488;--tealDark:#0F766E;--tealBg:#F0FDFA;--tealSoft:#CCFBF1;
  --amber:#B45309;--amberBg:#FFFBEB;--red:#B91C1C;--redBg:#FEF2F2;--green:#15803D;--greenBg:#F0FDF4;--indigo:#4338CA;--indigoBg:#EEF2FF;
  --sans:Calibri,Carlito,"Segoe UI",system-ui,sans-serif;--mono:Consolas,"Cascadia Mono","SF Mono",ui-monospace,monospace;--headH:48px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;overflow-x:hidden}
button{font:inherit;color:inherit}
a{color:var(--tealDark)}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
[hidden]{display:none!important}
mark{background:var(--tealSoft);color:inherit;border-radius:2px;padding:0 1px}
.wrap{max-width:1160px;margin:0 auto;padding:0 32px}
svg.ico{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

.site-head{position:sticky;top:0;z-index:40;background:var(--white);border-bottom:1px solid var(--line2);height:var(--headH)}
.site-head .wrap{height:100%;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-family:var(--mono);font-weight:700;color:var(--teal);letter-spacing:.18em;font-size:13px;white-space:nowrap}
.serie{font-family:var(--mono);color:var(--faint);font-size:12px;letter-spacing:.12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.hero{padding:40px 0 20px}
.route{font-family:var(--mono);font-size:12px;color:var(--faint);margin:0 0 8px}
h1{color:var(--ink);font-size:clamp(28px,5vw,40px);line-height:1.1;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.lead{max-width:760px;margin:0 0 6px}
.hero-meta{font-family:var(--mono);font-size:12px;color:var(--muted);margin:0 0 6px}
.cross{font-family:var(--mono);font-size:12px;margin:0 0 22px}
.cross a{text-decoration:none;border-bottom:1px solid var(--tealSoft)}
.cross a:hover{border-bottom-color:var(--teal)}

.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.search{position:relative;display:flex;align-items:center;flex:1 1 360px;max-width:560px}
.search input{width:100%;font:inherit;padding:9px 92px 9px 36px;border:1px solid var(--line);border-radius:6px;background:var(--white);color:var(--ink)}
.search input:focus-visible{outline:2px solid var(--teal);outline-offset:0;border-color:var(--teal)}
.search .ico{position:absolute;left:12px;color:var(--faint)}
.counter{position:absolute;right:12px;font-family:var(--mono);font-size:12px;color:var(--muted);pointer-events:none}

.dd{position:relative}
.dd-btn{height:100%;min-height:40px;display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--white);color:var(--muted);cursor:pointer;white-space:nowrap}
.dd-btn:hover{border-color:var(--faint);color:var(--ink)}
.dd-btn[aria-expanded="true"]{border-color:var(--teal);color:var(--ink)}
.dd-btn .n{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--teal);color:#fff;font-size:11px;text-align:center}
.dd-btn .caret{font-size:10px;color:var(--faint)}
.dd-menu{position:absolute;top:calc(100% + 6px);left:0;z-index:30;min-width:250px;background:var(--white);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 28px rgb(15 23 42 / .10);padding:6px}
.dd-menu label{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:5px;cursor:pointer;font-size:14px;color:var(--text)}
.dd-menu label:hover{background:var(--bg)}
.dd-menu input{accent-color:var(--teal);width:15px;height:15px;margin:0}
.dd-menu .dot{width:8px;height:8px;border-radius:50%;flex:none}
.dd-menu .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint)}
.dd-menu .clear{display:block;width:100%;text-align:left;margin-top:4px;border:0;border-top:1px solid var(--line2);background:none;padding:8px 8px 4px;font-family:var(--mono);font-size:12px;color:var(--tealDark);cursor:pointer}

.gnav{background:var(--bg);border-bottom:1px solid var(--line2);z-index:20}
.gnav ul{list-style:none;margin:0;padding:8px 0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.gnav ul::-webkit-scrollbar{display:none}
.gnav a{display:block;font-family:var(--mono);font-size:12px;white-space:nowrap;text-decoration:none;border:1px solid transparent;border-radius:4px;padding:5px 10px;color:var(--muted)}
.gnav a .n{color:var(--faint);margin-right:6px}
.gnav a:hover{color:var(--ink)}
.gnav a[aria-current="true"]{color:var(--tealDark);background:var(--tealBg);border-color:var(--tealSoft)}
@media (min-width:768px){.gnav{position:sticky;top:var(--headH)}}

main{padding-bottom:48px}
.group{padding:36px 0 4px;scroll-margin-top:100px}
.ceja{font-family:var(--mono);font-size:12px;letter-spacing:.12em;margin:0 0 6px;color:var(--faint);text-transform:uppercase}
.ceja .n{color:var(--teal)}
h2{color:var(--ink);font-size:24px;line-height:1.2;margin:0 0 4px;font-weight:700}
.bajada{margin:0 0 14px;color:var(--muted);max-width:780px}
.list{background:var(--white);border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:6px 24px;padding:16px 20px;border-top:1px solid var(--line2);scroll-margin-top:110px}
.row:first-child{border-top:0}
.row.target{background:var(--tealBg)}
.name{color:var(--ink);font-weight:700;font-size:16px;margin:0}
.name .num{font-family:var(--mono);color:var(--teal);margin-right:8px}
.meta{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin:2px 0 8px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.tag{font-family:var(--mono);font-size:11px;border-radius:3px;padding:0 6px;border:1px solid}
.tag.new{color:var(--amber);border-color:#FCD34D;background:var(--amberBg)}
.tag.fs{color:var(--muted);border-color:var(--line2);background:var(--bg)}
.desc{margin:0 0 4px}
details{margin-top:2px}
summary{cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--tealDark);list-style:none;display:inline-flex;align-items:center;gap:6px}
summary::-webkit-details-marker{display:none}
summary::before{content:"+";display:inline-block;width:12px;font-weight:700}
details[open] summary::before{content:"–"}
.det{margin:6px 0 0;padding:10px 14px;border-left:3px solid var(--teal);background:var(--tealBg);border-radius:0 4px 4px 0}
.det p{margin:0 0 8px}
.det ol{list-style:none;margin:0;padding:0}
.det li{padding:4px 0;border-top:1px solid var(--tealSoft)}
.det li:first-child{border-top:0}
.det .sn{font-family:var(--mono);font-weight:700;color:var(--teal);display:inline-block;min-width:34px}
.det .st{font-weight:700;color:var(--ink)}
.det .sd{display:block;margin-left:34px;color:var(--muted);font-size:13.5px}
.det .ss{display:block;margin-left:34px;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.side{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.badge{font-family:var(--mono);font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:4px;color:var(--c);background:var(--b)}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.btns{display:flex;flex-direction:column;gap:6px;width:100%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:var(--mono);font-size:12px;font-weight:700;text-decoration:none;border-radius:6px;padding:7px 10px;border:1px solid var(--teal);background:var(--teal);color:#fff;white-space:nowrap}
.btn:hover{background:var(--tealDark);border-color:var(--tealDark)}
.btn.ghost{background:var(--white);color:var(--tealDark);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--teal);background:var(--tealBg)}
.btn.off{background:var(--bg);color:var(--faint);border-color:var(--line2);cursor:default}
.btn.missing{background:var(--redBg);color:var(--red);border-color:#FECACA}
.pair{display:flex;gap:6px}
.pair .btn{flex:1}
.empty{padding:28px 20px;color:var(--muted);text-align:center;background:var(--white);border:1px dashed var(--line);border-radius:8px;margin-top:32px}
footer{border-top:1px solid var(--line2);padding:20px 0 40px;font-size:13px;color:var(--muted)}
footer p{margin:0 0 6px}
@media (max-width:720px){
  .wrap{padding:0 16px}
  .search{flex-basis:100%;max-width:none}
  .row{grid-template-columns:1fr;padding:14px 16px}
  .side{flex-direction:row;flex-wrap:wrap;align-items:center}
  .btns{width:auto;flex-direction:row;flex-wrap:wrap}
  .serie{display:none}
  .dd-menu{min-width:230px}
}
</style>
</head>

,"doc":"pdf"}},{"id":"n-4","g":4,"num":"04","showNum":false,"titulo":"Ley 21.746","metaHTML":"<span>N° 04</span><span>Congreso Nacional · 2025</span>","tags":[],"desc":"Modifica la Ley 20.585 para fortalecer la fiscalización y las sanciones.","det":{"label":"Por qué la necesita el proyecto","html":"<p>Consolida la licencia electrónica como regla, lo que vuelve digital la tramitación del empleador (PIEE y operadores): esa es la condición que hace posible automatizar. Desde el 24 de mayo de 2026 solo emiten licencias profesionales habilitados.</p>"},"search":"Consolida la licencia electrónica como regla, lo que vuelve digital la tramitación del empleador (PIEE y operadores): esa es la condición que hace posible automatizar. Desde el 24 de mayo de 2026 solo emiten licencias profesionales habilitados.","badge":{"text":"Vigente","c":"var(--green)","b":"var(--greenBg)"},"files":[{"label":"PDF","path":"docs/01-licencias/Ley_21746.pdf"}],"url":"https://www.diariooficial.interior.gob.cl/publicaciones/2025/05/24/44156/01/2649408.pdf","facets":{"estado":"V","doc":"pdf"}},{"id":"n-5","g":4,"num":"05","showNum":false,"titulo":"Ley 16.395","metaHTML":"<span>N° 05</span><span>Congreso Nacional</span>","tags":[{"cls":"new","text":"★ nueva"}],"desc":"Ley orgánica de la Superintendencia de Seguridad Social (SUSESO).","det":{"label":"Por qué la necesita el proyecto","html":"<p>Da a la SUSESO la facultad de interpretar las normas de licencias y subsidios y de dictar circulares. Por eso sus instrucciones obligan a operadores, COMPIN e ISAPRE, y condicionan lo que ve y hace el empleador.</p>"},"search":"Da a la SUSESO la facultad de interpretar las normas de licencias y subsidios y de dictar circulares. Por eso sus instrucciones obligan a operadores, COMPIN e ISAPRE, y condicionan lo que ve y hace el empleador.","badge":{"text":"Vigente","c":"var(--green)","b":"var(--greenBg)"},"files":[{"label":"PDF","path":"docs/01-licencias/Ley_16395.pdf"}],"url":"","facets":{"estado":"V","doc":"pdf"} const pad = n => String(n).padStart(2,'0');
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\./g,'');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = s => document.querySelector(s);
const state = { q:'', sel:{} };
const missing = new Set();
DATA.facets.forEach(f => state.sel[f.key] = new Set());
DATA.rows.forEach(r => r._q = norm([r.titulo, r.num, r.sub, r.desc, r.search || '', DATA.groups[r.g].titulo].join(' ')));

const ICO_DL = '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M3 13h10"/></svg>';

function hl(text, q){
  const t = esc(text); if(!q) return t;
  if(!norm(text).includes(q)) return t;
  let k=0, start=-1, end=-1; const i = norm(text).indexOf(q);
  for(let j=0;j<text.length;j++){
    const c = norm(text[j]); if(k===i && start<0) start=j; k += c.length;
    if(start>=0 && k>=i+q.length){ end=j+1; break; }
  }
  if(start<0||end<0) return t;
  return esc(text.slice(0,start)) + '<mark>' + esc(text.slice(start,end)) + '</mark>' + esc(text.slice(end));
}

const online = /^https?:$/.test(location.protocol) && !/^(localhost|127\.)/.test(location.hostname);
function buttons(r){
  if(r.files && r.files.length){
    return r.files.map(f => {
      const name = f.path.split('/').pop();
      const lab = r.files.length > 1 ? ' ' + esc(f.label) : '';
      if(missing.has(f.path)) return `<span class="btn missing" title="No se encontró ${esc(name)}">Archivo no encontrado${lab}</span>`;
      let open;
      if(DATA.viewer === 'office'){
        if(!online) return `<a class="btn" href="${encodeURI(f.path)}" download="${esc(name)}">${ICO_DL}Descargar${lab}</a>`;
        const abs = new URL(encodeURI(f.path), location.href).href;
        open = 'https://view.officeapps.live.com/op/view.aspx?src=' + encodeURIComponent(abs);
      } else open = encodeURI(f.path);
      return `<div class="pair"><a class="btn" href="${encodeURI(f.path)}" download="${esc(name)}" title="Descargar ${esc(name)}">${ICO_DL}Descargar${lab}</a><a class="btn ghost" href="${open}" target="_blank" rel="noopener" title="Abrir en una pestaña nueva">${ICO_EXT}Abrir</a></div>`;
    }).join('');
  }
  if(r.url) return `<a class="btn ghost" href="${esc(r.url)}" target="_blank" rel="noopener">${ICO_EXT}Ver en línea</a>`;
  return `<span class="btn off">Pendiente de descarga</span>`;
}

function rowHTML(r, q){
  const tags = (r.tags||[]).map(t => `<span class="tag ${t.cls}">${esc(t.text)}</span>`).join('');
  return `<article class="row" id="${r.id}">
    <div>
      <h3 class="name">${r.showNum ? `<span class="num">${esc(r.num)}</span>` : ''}${hl(r.titulo, q)}</h3>
      <div class="meta">${r.metaHTML}${tags}</div>
      <p class="desc">${hl(r.desc, q)}</p>
      ${r.det ? `<details><summary>${esc(r.det.label)}</summary><div class="det">${r.det.html}</div></details>` : ''}
    </div>
    <div class="side">
      <span class="badge" style="--c:${r.badge.c};--b:${r.badge.b}">${esc(r.badge.text)}</span>
      <div class="btns">${buttons(r)}</div>
    </div>
  </article>`;
}

function matches(r){
  for(const f of DATA.facets){ const s = state.sel[f.key]; if(s.size && !s.has(r.facets[f.key])) return false; }
  return !state.q || r._q.includes(state.q);
}

function render(){
  const q = state.q; let html = '', nav = '', shown = 0;
  DATA.groups.forEach((g,i) => {
    const rows = DATA.rows.filter(r => r.g === i && matches(r));
    if(!rows.length) return;
    shown += rows.length;
    const id = 'g-' + pad(i+1);
    nav += `<li><a href="#${id}" data-g="${id}"><span class="n">${pad(i+1)}</span>${esc(g.titulo)}</a></li>`;
    html += `<section class="group" id="${id}"><p class="ceja"><span class="n">${esc(DATA.groupWord)} ${pad(i+1)}</span> / ${rows.length} ${rows.length===1?DATA.unit[0]:DATA.unit[1]}</p><h2>${esc(g.titulo)}</h2>${g.bajada?`<p class="bajada">${esc(g.bajada)}</p>`:''}<div class="list">${rows.map(r=>rowHTML(r,q)).join('')}</div></section>`;
  });
  $('#content').innerHTML = html || '<div class="empty">No hay resultados para la búsqueda o los filtros elegidos.</div>';
  $('#gnav').innerHTML = nav;
  $('#counter').textContent = shown + ' de ' + DATA.rows.length;
  observeGroups();
}

// ---- menús desplegables de filtro ----
function closeMenus(except){ document.querySelectorAll('.dd').forEach(d => { if(d!==except){ d.querySelector('.dd-menu').hidden = true; d.querySelector('.dd-btn').setAttribute('aria-expanded','false'); } }); }
function buildMenus(){
  const ctr = $('#controls');
  DATA.facets.forEach(f => {
    const dd = document.createElement('div'); dd.className = 'dd';
    const btn = document.createElement('button'); btn.type='button'; btn.className='dd-btn'; btn.setAttribute('aria-haspopup','true'); btn.setAttribute('aria-expanded','false');
    const menu = document.createElement('div'); menu.className='dd-menu'; menu.hidden = true; menu.setAttribute('role','group'); menu.setAttribute('aria-label', f.label);
    const upd = () => { const n = state.sel[f.key].size; btn.innerHTML = `${esc(f.label)}${n?` <span class="n">${n}</span>`:''} <span class="caret">▾</span>`; };
    f.options.forEach(o => {
      const n = DATA.rows.filter(r => r.facets[f.key] === o.v).length;
      if(!n) return;
      const lab = document.createElement('label');
      lab.innerHTML = `<input type="checkbox" value="${esc(o.v)}">${o.c?`<span class="dot" style="background:${o.c}"></span>`:''}<span>${esc(o.label)}</span><span class="cnt">${n}</span>`;
      lab.querySelector('input').addEventListener('change', e => { e.target.checked ? state.sel[f.key].add(o.v) : state.sel[f.key].delete(o.v); upd(); render(); });
      menu.appendChild(lab);
    });
    const clr = document.createElement('button'); clr.type='button'; clr.className='clear'; clr.textContent='Limpiar filtro';
    clr.addEventListener('click', () => { state.sel[f.key].clear(); menu.querySelectorAll('input').forEach(i=>i.checked=false); upd(); render(); });
    menu.appendChild(clr);
    btn.addEventListener('click', e => { e.stopPropagation(); const open = menu.hidden; closeMenus(dd); menu.hidden = !open; btn.setAttribute('aria-expanded', String(open)); });
    menu.addEventListener('click', e => e.stopPropagation());
    upd(); dd.append(btn, menu); ctr.appendChild(dd);
  });
  document.addEventListener('click', () => closeMenus());
  document.addEventListener('keydown', e => { if(e.key==='Escape') closeMenus(); });
}

let io;
function observeGroups(){
  if(io) io.disconnect();
  const links = [...document.querySelectorAll('#gnav a')];
  io = new IntersectionObserver(es => es.forEach(en => { if(en.isIntersecting) links.forEach(a => a.setAttribute('aria-current', a.dataset.g===en.target.id)); }), {rootMargin:'-120px 0px -70% 0px'});
  document.querySelectorAll('.group').forEach(s => io.observe(s));
}

async function checkFiles(){
  if(!/^https?:$/.test(location.protocol)) return;
  const paths = [...new Set(DATA.rows.flatMap(r => (r.files||[]).map(f=>f.path)))];
  await Promise.all(paths.map(async p => { try{ const res = await fetch(encodeURI(p), {method:'HEAD', cache:'no-store'}); if(!res.ok) missing.add(p); }catch(e){ missing.add(p); } }));
  if(missing.size) render();
}
function focusHash(){
  const id = decodeURIComponent(location.hash.slice(1)); const el = id && document.getElementById(id);
  if(!el || !el.classList.contains('row')) return;
  document.querySelectorAll('.row.target').forEach(x=>x.classList.remove('target'));
  el.classList.add('target'); el.scrollIntoView({block:'center'});
}

$('#serie').textContent = DATA.serie; $('#route').textContent = DATA.route; $('#h1').textContent = DATA.title;
$('#lead').textContent = DATA.lead; $('#meta').textContent = DATA.meta;
$('#cross').innerHTML = `<a href="${esc(DATA.cross.href)}" target="_blank" rel="noopener">${esc(DATA.cross.label)} ↗</a>`;
$('#foot').innerHTML = DATA.footer.map(p => `<p>${esc(p)}</p>`).join('');
$('#q').placeholder = DATA.placeholder; $('#q').setAttribute('aria-label', DATA.placeholder);
let t;
$('#q').addEventListener('input', e => { clearTimeout(t); t = setTimeout(()=>{ state.q = norm(e.target.value.trim()); render(); }, 120); });
document.addEventListener('keydown', e => { if(e.key==='/' && document.activeElement.tagName!=='INPUT'){ e.preventDefault(); $('#q').focus(); } });
window.addEventListener('hashchange', focusHash);
buildMenus(); render(); focusHash(); checkFiles();
</script>
</body>
